server:
  port: ${PORT:8080}

spring:
  application:
    name: paaduta-teeyaga
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 45MB
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

logging:
  structured:
    format:
      console: logstash

analysis:
  pitch-cents: 50
  min-issue-seconds: 0.2
  min-issue-confidence: 0.6
  timing-seconds: 0.2
  min-alignment-confidence: 0.5
  seconds-per-issue: 10
  min-issues: 5
  max-issues: 20
  unsteady-cents: 70

app:
  cors:
    allowed-origins: https://*.github.io,http://localhost:[*],http://127.0.0.1:[*]
